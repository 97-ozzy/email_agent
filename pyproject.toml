[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "email-agent"
version = "0.1.0"
description = "A local, read-only email AI agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Email Agent contributors" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "docx2txt>=0.9",
    "email-reply-parser>=0.5.12",
    "gmail-agent>=0.3.0,<0.4",
    "llama-index-core>=0.14",
    "llama-index-embeddings-fastembed==0.7.0",
    "fastembed==0.9.1",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.9",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "qdrant-client[fastembed]>=1.16",
    "tiktoken>=0.14.0",
    "pydantic-ai-slim[openrouter]>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
email-agent = "email_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

