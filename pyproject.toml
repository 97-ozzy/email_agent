[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "email-agent"
version = "0.1.0"
description = "A local, read-only email AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Email Agent contributors" }]
dependencies = [
    "docx2txt>=0.9",
    "gmail-agent>=0.3.0,<0.4",
    "llama-index-readers-file>=0.7.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
email-agent = "email_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

